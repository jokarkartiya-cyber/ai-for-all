version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiforall-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_for_all}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aiforall-network

  redis:
    image: redis:7-alpine
    container_name: aiforall-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - aiforall-network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: aiforall-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aiforall-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiforall-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - aiforall-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aiforall-ai
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - aiforall-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiforall-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - aiforall-network

  nginx:
    image: nginx:alpine
    container_name: aiforall-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - aiforall-network

networks:
  aiforall-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
